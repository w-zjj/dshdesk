[package]
name = "dshdesk"
version = "1.0.0"
description = "DeepSeek Harness desktop wrapper"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dshdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = "2"
zip = "2"
rayon = "1"
windows = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 编译优先：关闭 LTO + 多 codegen-units 加速编译
# 代价是二进制略大，但打包频率低，编译时间更重要
strip = true
lto = false
codegen-units = 16
opt-level = 1
